<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6f1"/>
      <stop offset="1" stop-color="#efe7dc"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8407a"/><stop offset="1" stop-color="#b0205a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f86a3"/><stop offset="1" stop-color="#2f6f8f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="12" fill="url(#rose)"/>

  <!-- ribbon watermark -->
  <g fill="none" stroke="#c8306c" stroke-opacity="0.10" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" transform="translate(995,300) scale(5.2)">
    <path d="M29 23 C24 12 40 12 35 23"/>
    <path d="M29 23 L42 51"/>
    <path d="M35 23 L22 51"/>
  </g>

  <!-- left text -->
  <text x="70" y="104" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#c8306c">OBSERVATORIO DE DATOS · PERÚ</text>

  <text x="68" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1b1a22">¿Quién sufre</text>
  <text x="68" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1b1a22">violencia <tspan fill="#c8306c">en el Perú?</tspan></text>

  <text x="70" y="356" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#4b4956">Las mujeres son la mayoría de las víctimas</text>
  <text x="70" y="394" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1b1a22">— pero no las únicas.</text>

  <!-- gender gap bar -->
  <g transform="translate(70,448)">
    <rect x="0" y="0" width="610" height="46" rx="10" fill="url(#teal)"/>
    <rect x="0" y="0" width="519" height="46" rx="10" fill="url(#rose)"/>
    <text x="22" y="30" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Mujeres 85%</text>
    <text x="596" y="30" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Hombres 15%</text>
  </g>
  <text x="70" y="530" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#726f7e">Atenciones en Centros Emergencia Mujer (CEM) · MIMP</text>

  <!-- footer -->
  <text x="70" y="596" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#4b4956">INEI · ENDES / ENARES  +  MIMP · Warmi Ñan</text>
  <text x="1130" y="596" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#c8306c">unimauro.github.io/violencia-peru</text>

  <!-- right stat tiles -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(770,120)">
      <rect width="360" height="98" rx="16" fill="#ffffff" stroke="#e3ddd3"/>
      <text x="24" y="62" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#c8306c">53,8%</text>
      <text x="24" y="85" font-size="17" fill="#4b4956">mujeres, víctimas de su pareja</text>
    </g>
    <g transform="translate(770,232)">
      <rect width="360" height="98" rx="16" fill="#ffffff" stroke="#e3ddd3"/>
      <text x="24" y="62" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#1b1a22">162</text>
      <text x="24" y="85" font-size="17" fill="#4b4956">feminicidios en 2024 (~1 cada 2 días)</text>
    </g>
    <g transform="translate(770,344)">
      <rect width="360" height="98" rx="16" fill="#ffffff" stroke="#e3ddd3"/>
      <text x="24" y="62" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#2f6f8f">169 mil</text>
      <text x="24" y="85" font-size="17" fill="#4b4956">casos atendidos en CEM al año</text>
    </g>
  </g>
</svg>
